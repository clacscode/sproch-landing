
# --- Content-Security-Policy ---
# LiteSpeed inyecta su propia CSP ("upgrade-insecure-requests") que pisa la que
# emite Next desde next.config.ts, asi que hay que quitarla y volver a ponerla
# aqui. El resto de los headers de seguridad (X-Frame-Options, nosniff,
# Referrer-Policy, Permissions-Policy, HSTS) si llegan desde la app.
#
# Mantener sincronizada con la constante `csp` de next.config.ts.
# 'unsafe-inline' en script-src es deliberado: Next inyecta los scripts de
# hidratacion y la alternativa con nonce obligaria a renderizar todo dinamico.
<IfModule mod_headers.c>
    Header always unset Content-Security-Policy
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com; frame-src 'self' https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
</IfModule>
