# Render Blueprint para SPROCh (app Next.js).
# La base de datos MySQL vive en Hostinger; aquí solo corre la app.
# En Render: New → Blueprint → conecta este repo. Render lee este archivo.
#
# Notas:
# - El disco persiste las imágenes subidas (UPLOAD_DIR = public/uploads). Requiere
#   un plan de pago (los discos no están disponibles en el tier gratuito).
# - Marca los envVars con `sync: false` y complétalos en el panel (son secretos):
#   DATABASE_URL (cadena remota de Hostinger), AUTH_SECRET (openssl rand -base64 32),
#   AUTH_URL y NEXT_PUBLIC_SITE_URL (la URL pública de la app), ADMIN_*.
services:
  - type: web
    name: sproch
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /
    disk:
      name: uploads
      mountPath: /opt/render/project/src/public/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
