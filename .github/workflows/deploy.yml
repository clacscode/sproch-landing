name: Deploy a producción (Hostinger)

# Compila en CI (contenedor AlmaLinux 9, igual que el server) y despliega el
# resultado ya construido. El servidor NO recompila: solo recibe el artefacto,
# migra y reinicia Passenger → downtime de segundos en vez de minutos.
#
# Requisitos (Settings → Secrets and variables → Actions → Secrets):
#   SSH_PRIVATE_KEY      contenido de ~/.ssh/sproch_deploy (clave privada)
#   DATABASE_URL         cadena MySQL de producción
#   NEXT_PUBLIC_SITE_URL https://rehabilitacionoral.cl
#   NEXT_PUBLIC_GA_ID    (opcional) G-XXXXXXXXXX
#
# El auto-deploy de GitHub en hPanel debe quedar DESACTIVADO (este workflow
# reemplaza ese mecanismo).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Aplicar 'prisma migrate deploy' en el server (solo si cambió el esquema)"
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  SSH_HOST: "46.202.197.70"
  SSH_PORT: "65002"
  SSH_USER: "u273127787"
  REMOTE_DOMAIN: "domains/rehabilitacionoral.cl"
  SITE_URL: "https://rehabilitacionoral.cl"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Los secrets viven en el environment "Production" (Settings → Environments).
    environment: Production
    container:
      image: almalinux:9
    steps:
      - name: Instalar herramientas (node 20, git, rsync, ssh)
        run: |
          dnf -y install git rsync openssh-clients tar findutils which >/dev/null
          dnf -y module reset nodejs >/dev/null 2>&1 || true
          dnf -y module enable nodejs:20 >/dev/null 2>&1 || true
          dnf -y install nodejs >/dev/null
          node -v && npm -v

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Build (standalone)
        env:
          # Dummy: Prisma se construye al importar y exige formato válido, pero
          # el build NO consulta la DB (páginas públicas = force-dynamic). Nunca
          # conecta. La DB real solo se usa en el paso de migración (por SSH).
          DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          # Debe coincidir con el valor en runtime (hPanel) para que los IDs de
          # Server Actions sean estables y no salga "Failed to find Server Action".
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          npx prisma generate
          npx next build

      - name: Ensamblar artefacto standalone
        run: |
          set -e
          # Estáticos y públicos no van completos en el standalone. OJO: el
          # standalone YA crea un public/ (iconos/metadata), así que hay que
          # copiar el CONTENIDO de public (public/.) y no la carpeta dentro,
          # o quedaría public/public/ y los assets darían 404.
          mkdir -p .next/standalone/.next/static .next/standalone/public
          cp -a .next/static/. .next/standalone/.next/static/
          cp -a public/. .next/standalone/public/
          # Engine de runtime de Prisma (.prisma + @prisma/client) dentro del
          # standalone. El CLI de Prisma ya NO viaja: las migraciones se aplican
          # con el cliente mysql del server (ver scripts/remote-deploy.sh) — el
          # CLI se colgaba en este host y engordaba el artefacto.
          SA=.next/standalone/node_modules
          rm -rf "$SA/.prisma" "$SA/@prisma" "$SA/prisma"
          cp -r node_modules/.prisma "$SA/.prisma"
          cp -r node_modules/@prisma "$SA/@prisma"
          # Schema + migraciones (.sql) para el paso de migración por mysql.
          mkdir -p .next/standalone/prisma
          cp prisma/schema.prisma .next/standalone/prisma/
          cp -r prisma/migrations .next/standalone/prisma/ 2>/dev/null || true
          echo "— engine de Prisma incluido:"
          ls "$SA/.prisma/client" | grep -i query_engine \
            || { echo "ERROR: no se encontró el query engine en el standalone"; exit 1; }

      - name: Configurar SSH
        run: |
          # Rutas absolutas: en contenedores el $HOME del shell (/github/home)
          # no coincide con el ~ que expande ssh (/root). Usar $HOME explícito.
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          # ssh-keyscan depende de red; no debe abortar el paso (sh -e). El
          # known_hosts se completa igual por StrictHostKeyChecking=accept-new.
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Subir artefacto a staging
        run: |
          # El host es flaky bajo carga y a veces resetea la conexión. Reintentos
          # con backoff + keepalive + --partial (reanuda lo ya subido).
          RSH="ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=20"
          n=0
          until [ "$n" -ge 4 ]; do
            if rsync -az --delete --partial --timeout=90 -e "$RSH" \
                 .next/standalone/ \
                 "$SSH_USER@$SSH_HOST:$REMOTE_DOMAIN/deploy-staging/"; then
              echo "rsync OK (intento $((n + 1)))"
              exit 0
            fi
            n=$((n + 1))
            echo "::warning::rsync falló (intento $n/4) — reintento en $((n * 10))s…"
            sleep $((n * 10))
          done
          echo "::error::rsync falló tras 4 intentos (host saturado)."
          exit 1

      - name: Migrar + swap + restart
        id: swap
        run: |
          ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=10 \
            "$SSH_USER@$SSH_HOST" \
            "DATABASE_URL='${{ secrets.DATABASE_URL }}' RUN_MIGRATIONS='${{ github.event.inputs.run_migrations }}' bash -s" < scripts/remote-deploy.sh

      - name: Smoke test (HTTP 200)
        run: |
          ok=0
          for i in 1 2 3 4 5 6; do
            sleep 5
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$SITE_URL" || echo 000)
            echo "intento $i → HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::El sitio no respondió 200 tras el deploy."
            exit 1
          fi
          echo "Deploy verificado ✅"

      # Red de seguridad: si el swap se aplicó pero el sitio quedó roto, revierte
      # automáticamente al build anterior. Solo corre si el swap fue exitoso (no
      # si falló antes, donde el build en vivo sigue intacto).
      - name: Rollback automático si el deploy quedó roto
        if: ${{ failure() && steps.swap.outcome == 'success' }}
        run: |
          echo "::warning::Smoke test falló tras el swap → revirtiendo al build anterior"
          ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=10 \
            "$SSH_USER@$SSH_HOST" 'bash -s' < scripts/remote-rollback.sh
          echo "::error::Deploy revertido automáticamente. El build vivo es el anterior (sano)."
